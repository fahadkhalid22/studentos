function renderDash01(){
const courses=state.courses.filter(x=>!x.archived),up=state.assignments.filter(x=>!x.completed),due=up.filter(x=>x.dueAt<=isoDay(0)).length,g=semesterGpa(),h=state.focusHistory.filter(x=>x.date===isoDay()).reduce((s,x)=>s+x.duration,0);return `<div class="hero"><div class="hero-grid"><div><span class="hero-chip">${icon('cal','ic-sm')}&nbsp;${esc(state.semesters.find(s=>s.id===state.academic.activeSemester)?.name||'Active Semester')}</span><h2 style="margin-top:14px">Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}, ${esc(state.user.name.split(' ')[0])}</h2><p class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} · ${due>0?'You have '+due+' item'+ (due===1?'':'s')+' due — let’s clear them today.':'You’re all caught up. Stay ahead of the week.'}</p><div class="hero-cta"><button onclick="showQuickAdd()">${icon('plus','ic-sm')}&nbsp;Quick Add</button><button class="ghost" onclick="go('DOC-01')">${icon('upload','ic-sm')}&nbsp;Upload Study Material</button></div></div><div class="hero-side"><div class="hero-ring">${ringHtml(0,g.toFixed(2),'GPA',132,'rgba(255,255,255,.25)')}</div><div><div class="hero-side-label">Cumulative GPA</div><div class="hero-side-sub">target ${state.academic.targetGpa.toFixed(2)} · scale ${state.academic.gpaScale.toFixed(1)}</div></div></div></div></div><div class="kpi-row">${stat('Active Courses',courses.length)}${stat('Semester GPA',g.toFixed(2))}${stat('Assignments Due',up.length)}${stat('Study Today',h+'m')}</div><div class="grid" style="margin-top:0"><section class="card span-8"><div class="section-title"><h2>Upcoming Deadlines</h2><button class="small" onclick="go('PLAN-01')">View Planner</button></div>${up.slice(0,4).map(a=>`<div class="topic"><div class="row start"><div><b>${esc(a.title)}</b><div class="helper">${esc(course(a.courseId).code)} · ${fmtDate(a.dueAt)} · ${Math.max(0,daysUntil(a.dueAt))} day(s)</div></div>${priorityBadge(a.priority)}</div><div class="actions flush" style="margin-top:8px"><button class="small" onclick="ui.assignmentId='${a.id}';go('ASSIGN-03')">View</button><button class="small" onclick="toggleAssignment('${a.id}')">Mark Complete</button></div></div>`).join('')||'<p class="muted">No assignments due right now.</p>'}</section><section class="card span-4 ai-card"><span class="ic-box indigo">${icon('brain','ic-md')}</span><h2>AI Study</h2><p class="muted">Transform your documents into summaries, MCQs, flashcards, or a full exam pack.</p><div class="actions mobile-stack"><button class="primary" onclick="go('PREP-01')">Prepare Me for Exam</button><button onclick="go('SUM-01')">Summarize</button><button onclick="go('MCQ-01')">Create MCQs</button><button onclick="go('FLASH-01')">Flashcards</button></div></section><section class="card span-6"><div class="section-title"><h3>Attendance Risk</h3><button class="small" onclick="go('ATT-01')">View All</button></div>${state.courses.map(c=>({c,s:attendanceSummary(c.id)})).filter(x=>x.s.status!=='Safe').slice(0,3).map(({c,s})=>`<div class="topic"><div class="row"><div><b>${esc(c.code)} ${esc(c.name)}</b><div class="helper">Current ${s.pct}% · target ${s.target}%</div></div>${statusBadge(s.status)}</div></div>`).join('')||'<p class="muted">All courses are at or above target.</p>'}<button class="small" onclick="go('ATT-03')">Add Attendance</button></section><section class="card span-6"><div class="section-title"><h3>Focus / Study</h3><button class="small" onclick="go('FOCUS-01')">Start Session</button></div><div class="kpi-row" style="grid-template-columns:1fr 1fr">${stat('Study Today',h+'m')}${stat('Sessions',state.focusHistory.length)}</div><div class="row"><span>Current streak</span><b>4 days</b></div><div class="row"><span>Hours this week</span><b>7.5</b></div><div class="actions"><button onclick="go('FOCUS-04')">View Study History</button></div></section></div>`;
}
function showQuickAdd(){openModal(`<div class="modal-head"><div><h2>Quick Add</h2><p class="muted">Create academic items without leaving your workflow.</p></div><button class="icon ghost" aria-label="Close" onclick="closeModal()">×</button></div><div class="menu"><button onclick="closeModal();go('ASSIGN-02')">Add Assignment</button><button onclick="closeModal();go('EXAM-02')">Add Exam</button><button onclick="closeModal();go('ATT-03')">Add Attendance</button><button onclick="closeModal();go('COURSE-02')">Add Course</button><button onclick="closeModal();go('FOCUS-01')">Start Focus Session</button></div>`)}

// ---------------- Semesters ----------------
function semesterCourseCount(id){return state.courses.filter(c=>c.semesterId===id).length}
function renderSem01(){return `${pageHead('Semesters','Manage academic periods and choose the active semester.','Academic / Semesters')}<div class="toolbar"><div></div><button class="primary" onclick="go('SEM-02')">New Semester</button></div><div class="grid">${state.semesters.map(s=>`<div class="card span-4"><div class="row start"><div><h3>${esc(s.name)}</h3><div class="helper">${fmtDate(s.start)} – ${fmtDate(s.end)}</div></div>${statusBadge(s.status)}</div><div class="meta-list"><div class="meta-item"><div class="label">Courses</div><div class="value">${semesterCourseCount(s.id)}</div></div><div class="meta-item"><div class="label">Semester GPA</div><div class="value">${s.status==='Future'?'—':semesterGpa().toFixed(2)}</div></div></div><div class="actions"><button class="small" ${s.status==='Active'?'disabled':''} onclick="setActiveSemester('${s.id}')">Set Active</button><button class="small" onclick="ui.semesterId='${s.id}';go('SEM-03')">Edit</button><button class="small" onclick="archiveSemester('${s.id}')">Archive</button><button class="small danger" onclick="ui.semesterId='${s.id}';go('SEM-04')">Delete</button></div></div>`).join('')||emptyState('No Semesters','Create your first academic semester.','New Semester',"go('SEM-02')")}</div>`}
function setActiveSemester(id){state.semesters.forEach(s=>{if(s.id===id)s.status='Active';else if(s.status==='Active')s.status='Completed'});state.academic.activeSemester=id;showToast('Active semester updated');render()}
function archiveSemester(id){const s=state.semesters.find(x=>x.id===id);if(s){s.status='Completed';showToast('Semester archived');render()}}
function semesterForm(mode){const s=mode==='edit'?(state.semesters.find(x=>x.id===ui.semesterId)||state.semesters[0]):{name:'',start:isoDay(0),end:isoDay(120),status:'Future'};return `${pageHead(mode==='edit'?'Edit Semester':'Create Semester',mode==='edit'?'Update semester dates and status.':'Add a new academic period.','Academic / Semesters')}<div class="card" style="max-width:720px">${textInput('semName','Semester Name',s.name)}${textInput('semStart','Start Date',s.start,{type:'date'})}${textInput('semEnd','End Date',s.end,{type:'date'})}<label class="checkbox-row"><input id="semActive" type="checkbox" ${s.status==='Active'?'checked':''}> Set as active semester</label><div id="semErr"></div><div class="actions end"><button onclick="${mode==='edit'?"confirmUnsaved('SEM-01')":"go('SEM-01')"}">Cancel</button><button class="primary" onclick="saveSemester('${mode}')">${mode==='edit'?'Save Changes':'Create Semester'}</button></div></div>`}
function renderSem02(){return semesterForm('create')}
function renderSem03(){return semesterForm('edit')}
function saveSemester(mode){if(navigator.onLine===false){showSystemState('network');return}const name=document.getElementById('semName').value.trim(),start=document.getElementById('semStart').value,end=document.getElementById('semEnd').value,active=document.getElementById('semActive').checked;if(!name||!start||!end){document.getElementById('semErr').innerHTML=alertBox('All semester fields are required.','danger');return}if(new Date(end)<new Date(start)){document.getElementById('semErr').innerHTML=alertBox('End date cannot be before start date.','danger');return}let id;if(mode==='create'){id='sem'+Date.now();state.semesters.push({id,name,start,end,status:active?'Active':'Future'})}else{id=ui.semesterId;Object.assign(state.semesters.find(s=>s.id===id),{name,start,end})}if(active)setActiveSemester(id);showToast(mode==='create'?'Semester created':'Semester updated');go('SEM-01')}
function renderSem04(){const s=state.semesters.find(x=>x.id===ui.semesterId)||state.semesters[0];return `${pageHead('Delete Semester','Review the consequences before permanently deleting this semester.','Academic / Semesters')}<div class="card" style="max-width:720px"><h2>Delete ${esc(s.name)}?</h2>${alertBox('Deleting this semester can disconnect courses, assignments, exams, grades and attendance associated with it. This prototype does not silently delete linked records.','danger')}<div class="meta-list"><div class="meta-item"><div class="label">Courses</div><div class="value">${semesterCourseCount(s.id)}</div></div><div class="meta-item"><div class="label">Status</div><div class="value">${esc(s.status)}</div></div></div><div class="actions end"><button onclick="go('SEM-01')">Cancel</button><button class="danger" onclick="confirmDeleteSemester('${s.id}')">Delete Semester</button></div></div>`}
function confirmDeleteSemester(id){confirmAction('Delete Semester','This action cannot be undone in the prototype.',()=>{state.semesters=state.semesters.filter(s=>s.id!==id);showToast('Semester deleted');go('SEM-01')},'Delete Semester')}

// ---------------- Courses ----------------
function courseCard(c){const a=attendanceSummary(c.id),due=state.assignments.filter(x=>x.courseId===c.id&&!x.completed).length,next=state.exams.filter(x=>x.courseId===c.id).sort((x,y)=>new Date(x.date)-new Date(y.date))[0];return `<div class="card span-4"><div class="row start"><div><h3>${esc(c.name)}</h3><div class="helper">${esc(c.code)} · ${c.credits} credits</div></div>${c.archived?badge('Completed','info'):badge('Active','success')}</div><div class="meta-list"><div class="meta-item"><div class="label">Instructor</div><div class="value">${esc(c.instructor||'Not set')}</div></div><div class="meta-item"><div class="label">Attendance</div><div class="value">${a.pct}% ${statusBadge(a.status)}</div></div><div class="meta-item"><div class="label">Grade Point</div><div class="value">${Number(c.gradePoint||0).toFixed(1)}</div></div><div class="meta-item"><div class="label">Assignments Due</div><div class="value">${due}</div></div><div class="meta-item"><div class="label">Next Exam</div><div class="value">${next?`${Math.max(0,daysUntil(next.date))} day(s)`:'None'}</div></div></div><div class="actions"><button class="primary small" onclick="ui.courseId='${c.id}';go('COURSE-04')">Open Course</button><button class="small" onclick="ui.courseId='${c.id}';go('COURSE-03')">Edit</button><button class="small" onclick="toggleCourseArchive('${c.id}')">${c.archived?'Restore':'Archive'}</button><button class="small danger" onclick="confirmDeleteCourse('${c.id}')">Delete</button></div></div>`}
function renderCourse01(){const q=ui.courseSearch.toLowerCase(),filtered=state.courses.filter(c=>(c.name+' '+c.code).toLowerCase().includes(q)&&(ui.courseFilter==='All'||(ui.courseFilter==='Active'&&!c.archived)||(ui.courseFilter==='Completed'&&c.archived)));return `${pageHead('Courses','Manage courses for the selected semester.','Courses')}<div class="toolbar"><div class="toolbar-group"><div class="field"><label for="courseSearchInput">Search Courses</label><input id="courseSearchInput" value="${esc(ui.courseSearch)}" placeholder="Search Courses" oninput="ui.courseSearch=this.value;render()"></div><div class="field"><label for="courseSemesterFilter">Semester</label><select id="courseSemesterFilter" onchange="state.academic.activeSemester=this.value;render()">${state.semesters.map(s=>`<option value="${s.id}" ${s.id===state.academic.activeSemester?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div></div><div class="toolbar-group">${segmented(['All','Active','Completed'],ui.courseFilter,'setCourseFilter')}<button class="primary" onclick="go('COURSE-02')">Add Course</button></div></div>${filtered.length?`<div class="grid">${filtered.map(courseCard).join('')}</div>`:emptyState('No Courses','No courses match the current semester or filters.','Add Course',"go('COURSE-02')")}`}
function setCourseFilter(v){ui.courseFilter=v;render()}
function toggleCourseArchive(id){const c=course(id);c.archived=!c.archived;showToast(c.archived?'Course archived':'Course restored');render()}
function confirmDeleteCourse(id){const c=course(id);confirmAction('Delete Course',`Delete ${esc(c.name)}? Associated prototype records will also be removed from this course.`,()=>{state.courses=state.courses.filter(x=>x.id!==id);delete state.attendance[id];state.grades=state.grades.filter(g=>g.courseId!==id);state.assignments=state.assignments.filter(a=>a.courseId!==id);state.exams=state.exams.filter(e=>e.courseId!==id);showToast('Course deleted');if(current==='COURSE-04'||current==='COURSE-03')go('COURSE-01');else render()},'Delete Course')}
function courseForm(mode){const c=mode==='edit'?course(ui.courseId):{name:'',code:'',credits:3,instructor:'',attendanceTarget:state.academic.attendanceTarget,description:''};return `${pageHead(mode==='edit'?'Edit Course':'Add Course',mode==='edit'?'Update course details and defaults.':'Add a course to your active semester.','Courses')}<div class="card" style="max-width:760px">${textInput('courseName','Course Name',c.name)}${textInput('courseCode','Course Code',c.code)}${textInput('courseCredits','Credit Hours',c.credits,{type:'number',min:1,max:10})}${textInput('courseInstructor','Instructor Optional',c.instructor)}${textInput('courseAtt','Attendance Target %',c.attendanceTarget,{type:'number',min:0,max:100})}${textareaInput('courseDesc','Description Optional',c.description||'')}<div id="courseErr"></div><div class="actions between"><button onclick="${mode==='edit'?"confirmUnsaved('COURSE-04')":"go('COURSE-01')"}">Cancel</button><div class="actions flush">${mode==='edit'?`<button class="danger" onclick="confirmDeleteCourse('${c.id}')">Delete Course</button>`:''}<button class="primary" onclick="saveCourse('${mode}')">${mode==='edit'?'Save Changes':'Add Course'}</button></div></div></div>`}
function renderCourse02(){return courseForm('create')}
function renderCourse03(){return courseForm('edit')}
function saveCourse(mode){if(navigator.onLine===false){showSystemState('network');return}const name=document.getElementById('courseName').value.trim(),code=document.getElementById('courseCode').value.trim(),credits=+document.getElementById('courseCredits').value,instructor=document.getElementById('courseInstructor').value.trim(),attendanceTarget=+document.getElementById('courseAtt').value,description=document.getElementById('courseDesc').value.trim();if(!name||!code||!(credits>0)||attendanceTarget<0||attendanceTarget>100){document.getElementById('courseErr').innerHTML=alertBox('Course name, code, valid credits and attendance target are required.','danger');return}if(mode==='create'){const id='c'+Date.now();state.courses.push({id,semesterId:state.academic.activeSemester,name,code,credits,instructor,attendanceTarget,description,gradePoint:0,archived:false});state.attendance[id]=[];ui.courseId=id;showToast('Course added');go('COURSE-04')}else{Object.assign(course(ui.courseId),{name,code,credits,instructor,attendanceTarget,description});showToast('Course updated');go('COURSE-04')}}
function setCourseTab(t){ui.courseTab=t;render()}
function renderCourse04(){
const c=course(ui.courseId),a=attendanceSummary(c.id),as=state.assignments.filter(x=>x.courseId===c.id),ex=state.exams.filter(x=>x.courseId===c.id),docs=state.documents.filter(x=>x.courseId===c.id);let panel='';if(ui.courseTab==='Overview')panel=`<div class="grid"><div class="card span-4 stat"><div class="k">Attendance Summary</div><div class="v">${a.pct}%</div>${statusBadge(a.status)}</div><div class="card span-4 stat"><div class="k">Grade Summary</div><div class="v">${Number(c.gradePoint||0).toFixed(1)}</div><div class="delta">of ${state.academic.gpaScale.toFixed(1)}</div></div><div class="card span-4 stat"><div class="k">Study Time</div><div class="v">${state.focusHistory.filter(f=>f.courseId===c.id).reduce((s,f)=>s+f.duration,0)}m</div></div><div class="card span-6"><h3>Upcoming Assignments</h3>${as.filter(x=>!x.completed).slice(0,3).map(x=>`<div class="topic"><b>${esc(x.title)}</b><div class="helper">${fmtDate(x.dueAt)} · ${assignmentStatus(x)}</div></div>`).join('')||'<p class="muted">No upcoming assignments.</p>'}</div><div class="card span-6"><h3>Upcoming Exams</h3>${ex.map(x=>`<div class="topic"><b>${esc(x.title)}</b><div class="helper">${fmtDate(x.date)} · ${Math.max(0,daysUntil(x.date))} day(s)</div></div>`).join('')||'<p class="muted">No upcoming exams.</p>'}</div><div class="card span-12"><h3>Documents</h3>${docs.map(d=>`<div class="topic row"><span>${esc(d.name)}</span>${statusBadge(d.status)}</div>`).join('')||'<p class="muted">No documents uploaded.</p>'}</div></div>`;else if(ui.courseTab==='Attendance')panel=renderCourseAttendancePanel(c);else if(ui.courseTab==='Grades')panel=renderCourseGradesPanel(c);else if(ui.courseTab==='Assignments')panel=`<div class="card"><h3>Assignments</h3>${assignmentRows(as)}</div>`;else if(ui.courseTab==='Exams')panel=`<div class="card"><h3>Exams</h3>${ex.map(e=>`<div class="topic row"><div><b>${esc(e.title)}</b><div class="helper">${fmtDate(e.date)} · ${e.time}</div></div><button class="small" onclick="ui.examId='${e.id}';go('EXAM-03')">Open</button></div>`).join('')||'<p class="muted">No exams yet.</p>'}</div>`;else if(ui.courseTab==='Documents')panel=`<div class="card"><h3>Documents</h3>${docs.map(d=>`<div class="topic row"><div><b>${esc(d.name)}</b><div class="helper">${d.pages} pages · ${d.status}</div></div><button class="small" onclick="ui.documentId='${d.id}';go('DOC-06')">Open</button></div>`).join('')||'<p class="muted">No documents yet.</p>'}</div>`;
const hero=`<div class="hero"><div class="hero-grid"><div><span class="hero-chip">${icon('book','ic-sm')}&nbsp;${esc(c.code)} &middot; ${c.credits} credit${c.credits===1?'':'s'}</span><h2 style="margin-top:14px">${esc(c.name)}</h2><p class="sub">${esc(c.instructor||'Instructor not yet set')}</p><div class="hero-cta"><button onclick="go('COURSE-03')">${icon('pen','ic-sm')}&nbsp;Edit Course</button></div></div><div class="hero-side"><div class="hero-ring">${attRing(c.id,132)}</div><div><div class="hero-side-label">Attendance</div><div class="hero-side-sub">${a.pct}% vs ${a.target}% target &middot; ${a.status}</div></div></div></div></div>`;
const actions=`<div class="actions"><button onclick="go('ATT-03')">Add Attendance</button><button onclick="go('GPA-02')">Add Grade</button><button onclick="go('ASSIGN-02')">Add Assignment</button><button onclick="go('EXAM-02')">Add Exam</button><button onclick="go('DOC-01')">Upload Document</button></div>`;
return `${hero}${tabs(['Overview','Attendance','Grades','Assignments','Exams','Documents'],ui.courseTab,'setCourseTab','tabrail')}${actions}${panel}`;
}
function renderCourseAttendancePanel(c){const s=attendanceSummary(c.id);return `<div class="grid">${stat('Current Attendance',s.pct+'%','Target '+s.target+'%')}${stat('Held',s.held)}${stat('Attended',s.attended)}${stat('Missed',s.missed)}<div class="card span-12"><div class="row"><h3>Status</h3>${statusBadge(s.status)}</div><p class="muted">Cancelled classes are excluded from held classes.</p><button onclick="ui.attendanceCourse='${c.id}';go('ATT-02')">View Attendance Detail</button></div></div>`}
function renderCourseGradesPanel(c){const g=state.grades.find(x=>x.courseId===c.id);return `<div class="card"><div class="row"><div><h3>Current Grade Point</h3><p class="muted">Direct numeric grade point</p></div><div class="stat"><div class="v">${g?g.gradePoint.toFixed(2):'—'}</div></div></div><button onclick="ui.gradeCourse='${c.id}';go('GPA-02')">${g?'Edit Grade':'Add Grade'}</button></div>`}
// ---------------- Attendance ----------------
function attendanceTableRows(){return state.courses.filter(c=>!c.archived).map(c=>{const s=attendanceSummary(c.id);return `<tr><td>${esc(c.code)} · ${esc(c.name)}</td><td>${s.held}</td><td>${s.attended}</td><td>${s.missed}</td><td>${s.cancelled}</td><td>${s.pct}%</td><td>${s.target}%</td><td>${statusBadge(s.status)}</td><td><button class="small" onclick="ui.attendanceCourse='${c.id}';go('ATT-02')">View Details</button> <button class="small" onclick="ui.attendanceCourse='${c.id}';go('ATT-03')">Add Record</button></td></tr>`}).join('')}
function attendanceMobileCards(){return state.courses.filter(c=>!c.archived).map(c=>{const s=attendanceSummary(c.id);return `<div class="mobile-card"><div class="row start"><div><b>${esc(c.code)} ${esc(c.name)}</b><div class="helper">Target ${s.target}%</div></div>${statusBadge(s.status)}</div><div class="metrics"><div class="metric"><div class="k">Current</div><div class="v">${s.pct}%</div></div><div class="metric"><div class="k">Held</div><div class="v">${s.held}</div></div><div class="metric"><div class="k">Attended</div><div class="v">${s.attended}</div></div><div class="metric"><div class="k">Missed</div><div class="v">${s.missed}</div></div></div><div class="actions"><button class="small" onclick="ui.attendanceCourse='${c.id}';go('ATT-02')">View Details</button><button class="small" onclick="ui.attendanceCourse='${c.id}';go('ATT-03')">Add Record</button></div></div>`}).join('')}
function renderAtt01(){
const summaries=state.courses.filter(c=>!c.archived).map(c=>attendanceSummary(c.id)),overallHeld=summaries.reduce((a,s)=>a+s.held,0),overallAtt=summaries.reduce((a,s)=>a+s.attended,0),overall=overallHeld?Math.round(overallAtt/overallHeld*100):0;return `<div class="hero"><div class="hero-grid"><div><span class="hero-chip">${icon('shield','ic-sm')}&nbsp;Attendance</span><h2 style="margin-top:14px">Academic attendance</h2><p class="sub">Track attendance against course targets. Cancelled classes do not count as held classes.</p><div class="hero-cta"><button onclick="go('ATT-03')">${icon('plus','ic-sm')}&nbsp;Add Attendance</button></div></div><div class="hero-side"><div class="hero-ring">${ringHtml(overall,overall+'%','overall',132,'var(--indigo)')}</div><div><div class="hero-side-label">Overall Attendance</div><div class="hero-side-sub">across ${summaries.length} course${summaries.length===1?'':'s'}</div></div></div></div></div><div class="toolbar"><div class="field"><label for="attSemesterFilter">Semester</label><select id="attSemesterFilter"><option>${esc(state.semesters.find(s=>s.id===state.academic.activeSemester)?.name||'Active Semester')}</option></select></div><div></div></div><div class="kpi-row">${stat('Overall Attendance',overall+'%')}${stat('Safe Courses',summaries.filter(s=>s.status==='Safe').length)}${stat('Warning Courses',summaries.filter(s=>s.status==='Warning').length)}${stat('At Risk Courses',summaries.filter(s=>s.status==='At Risk').length)}</div><div style="height:16px"></div><div class="table-wrap desktop-only"><table><thead><tr><th>Course</th><th>Held</th><th>Attended</th><th>Missed</th><th>Cancelled</th><th>Current %</th><th>Target %</th><th>Status</th><th>Actions</th></tr></thead><tbody>${attendanceTableRows()}</tbody></table></div><div class="mobile-cards">${attendanceMobileCards()}</div>`
}
function renderAtt02(){const c=course(ui.attendanceCourse),s=attendanceSummary(c.id),rows=state.attendance[c.id]||[];return `${pageHead(`${c.name} Attendance`,`${c.code} · Current ${s.pct}% · Target ${s.target}%`,'Attendance / '+c.code)}<div class="toolbar"><div>${statusBadge(s.status)}</div><button class="primary" onclick="go('ATT-03')">Add Attendance Record</button></div><div class="kpi-row">${stat('Held',s.held)}${stat('Attended',s.attended)}${stat('Missed',s.missed)}${stat('Cancelled',s.cancelled)}</div><div style="height:16px"></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${statusBadge(r.status)}</td><td>${esc(r.notes||'—')}</td><td><button class="small" onclick="ui.attendanceRecord='${r.id}';go('ATT-04')">Edit</button> <button class="small danger" onclick="ui.attendanceRecord='${r.id}';go('ATT-05')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:emptyState('No Attendance Records','Add the first attendance record for this course.','Add Attendance Record',"go('ATT-03')")}`}
function attendanceForm(mode){const c=course(ui.attendanceCourse||ui.courseId);const rec=mode==='edit'?(state.attendance[c.id]||[]).find(r=>r.id===ui.attendanceRecord)||{date:isoDay(0),status:'Present',notes:''}:{date:isoDay(0),status:'Present',notes:''};return `${pageHead(mode==='edit'?'Edit Attendance':'Add Attendance',`${c.code} · ${c.name}`,'Attendance')}<div class="card" style="max-width:680px">${selectInput('attCourse','Course',state.courses.map(x=>({value:x.id,label:`${x.code} · ${x.name}`})),c.id)}${textInput('attDate','Date',rec.date,{type:'date'})}${selectInput('attStatus','Status',['Present','Absent','Cancelled'],rec.status,'Cancelled classes do not count as held classes.')}${textareaInput('attNotes','Optional Notes',rec.notes||'')}<div id="attErr"></div><div class="actions end"><button onclick="${mode==='edit'?"confirmUnsaved('ATT-02')":"go('ATT-02')"}">Cancel</button><button class="primary" onclick="saveAttendance('${mode}')">${mode==='edit'?'Save Changes':'Save Record'}</button></div></div>`}
function renderAtt03(){return attendanceForm('create')}
function renderAtt04(){return attendanceForm('edit')}
function saveAttendance(mode){if(navigator.onLine===false){showSystemState('network');return}const courseId=document.getElementById('attCourse').value,date=document.getElementById('attDate').value,status=document.getElementById('attStatus').value,notes=document.getElementById('attNotes').value.trim();if(!date){document.getElementById('attErr').innerHTML=alertBox('Date is required.','danger');return}if(!state.attendance[courseId])state.attendance[courseId]=[];if(mode==='create'){state.attendance[courseId].push({id:'att'+Date.now(),date,status,notes})}else{const arr=state.attendance[ui.attendanceCourse]||[],r=arr.find(x=>x.id===ui.attendanceRecord);if(r)Object.assign(r,{date,status,notes});if(courseId!==ui.attendanceCourse&&r){state.attendance[ui.attendanceCourse]=arr.filter(x=>x.id!==r.id);state.attendance[courseId].push(r)}}ui.attendanceCourse=courseId;showToast(mode==='create'?'Attendance saved':'Attendance updated');go('ATT-02')}
function renderAtt05(){const c=course(ui.attendanceCourse),r=(state.attendance[c.id]||[]).find(x=>x.id===ui.attendanceRecord);return `${pageHead('Delete Attendance Record','This removes one recorded class status.','Attendance / '+c.code)}<div class="card" style="max-width:640px"><h2>Delete this record?</h2><div class="meta-list"><div class="meta-item"><div class="label">Date</div><div class="value">${r?fmtDate(r.date):'Unknown'}</div></div><div class="meta-item"><div class="label">Status</div><div class="value">${r?statusBadge(r.status):'—'}</div></div></div>${alertBox('Attendance percentage will be recalculated deterministically after deletion.','warning')}<div class="actions end"><button onclick="go('ATT-02')">Cancel</button><button class="danger" onclick="deleteAttendanceRecord()">Delete</button></div></div>`}
function deleteAttendanceRecord(){confirmAction('Delete Attendance Record','Remove this attendance entry and recalculate the course percentage?',()=>{state.attendance[ui.attendanceCourse]=(state.attendance[ui.attendanceCourse]||[]).filter(r=>r.id!==ui.attendanceRecord);ui.attendanceRecord=null;showToast('Attendance record deleted');go('ATT-02')},'Delete Record')}

// ---------------- GPA / CGPA ----------------
function gradeRows(){return state.grades.map(g=>{const c=course(g.courseId);return `<tr><td>${esc(c.code)} · ${esc(c.name)}</td><td>${c.credits}</td><td>${g.gradePoint.toFixed(2)}</td><td>${(g.gradePoint*c.credits).toFixed(2)}</td><td><button class="small" onclick="ui.gradeCourse='${c.id}';go('GPA-02')">Edit</button></td></tr>`}).join('')}
function gradeMobileCards(){return state.grades.map(g=>{const c=course(g.courseId);return `<div class="mobile-card"><div class="row"><div><b>${esc(c.code)} ${esc(c.name)}</b><div class="helper">${c.credits} credits</div></div><button class="small" onclick="ui.gradeCourse='${c.id}';go('GPA-02')">Edit</button></div><div class="metrics"><div class="metric"><div class="k">Grade Point</div><div class="v">${g.gradePoint.toFixed(2)}</div></div><div class="metric"><div class="k">Weighted</div><div class="v">${(g.gradePoint*c.credits).toFixed(2)}</div></div></div></div>`}).join('')}
function renderGpa01(){
const sg=semesterGpa(),gpc=sg/state.academic.gpaScale*100;return `<div class="hero"><div class="hero-grid"><div><span class="hero-chip">${icon('calc','ic-sm')}&nbsp;Numeric grade points</span><h2 style="margin-top:14px">GPA / CGPA</h2><p class="sub">Direct numeric grade points only. StudentOS does not invent letter-grade conversion.</p><div class="hero-cta"><button onclick="go('GPA-03')">${icon('clock','ic-sm')}&nbsp;GPA History</button><button onclick="go('GPA-02')">${icon('plus','ic-sm')}&nbsp;Add Grade</button></div></div><div class="hero-side"><div class="hero-ring">${ringHtml(Math.max(0,Math.min(100,gpc)),sg.toFixed(2),'GPA',132,'var(--indigo)')}</div><div><div class="hero-side-label">Semester GPA</div><div class="hero-side-sub">scale ${state.academic.gpaScale.toFixed(1)} &middot; target ${state.academic.targetGpa.toFixed(2)}</div></div></div></div></div><div class="toolbar"><div class="field"><label for="gpaSemesterFilter">Semester</label><select id="gpaSemesterFilter"><option>${esc(state.semesters.find(s=>s.id===state.academic.activeSemester)?.name||'Active Semester')}</option></select></div><div></div></div><div class="kpi-row">${stat('Semester GPA',sg.toFixed(2))}${stat('Overall CGPA','3.36')}${stat('Total Credits',state.courses.reduce((a,c)=>a+c.credits,0))}${stat('Target GPA',state.academic.targetGpa.toFixed(2))}</div><div style="height:16px"></div>${state.grades.length?`<div class="table-wrap desktop-only"><table><thead><tr><th>Course</th><th>Credit Hours</th><th>Grade Point</th><th>Weighted Points</th><th>Actions</th></tr></thead><tbody>${gradeRows()}</tbody></table></div><div class="mobile-cards">${gradeMobileCards()}</div>`:emptyState('No Grades','Add numeric grade points to calculate semester GPA.','Add Grade',"go('GPA-02')")}`
}
function renderGpa02(){const existing=state.grades.find(g=>g.courseId===ui.gradeCourse),c=course(ui.gradeCourse);return `${pageHead(existing?'Edit Grade':'Add Grade','Grade Point is a direct numeric value.','GPA / CGPA')}<div class="card" style="max-width:680px">${selectInput('gradeCourse','Course',state.courses.map(x=>({value:x.id,label:`${x.code} · ${x.name}`})),c.id)}${textInput('gradeCredits','Credit Hours',c.credits,{type:'number',min:1,max:10,helper:'Prefilled from the selected course.'})}${textInput('gradePoint','Grade Point',existing?existing.gradePoint:'',{type:'number',min:0,max:state.academic.gpaScale,step:'0.01',helper:`Allowed range: 0.0 — ${state.academic.gpaScale.toFixed(1)}`})}<div id="gradeErr"></div><div class="actions end"><button onclick="go('GPA-01')">Cancel</button><button class="primary" onclick="saveGrade()">Save Grade</button></div></div>`}
function saveGrade(){if(navigator.onLine===false){showSystemState('network');return}const cid=document.getElementById('gradeCourse').value,gp=Number(document.getElementById('gradePoint').value);if(Number.isNaN(gp)){document.getElementById('gradeErr').innerHTML=alertBox('Grade Point must be numeric.','danger');return}if(gp<0){document.getElementById('gradeErr').innerHTML=alertBox('Grade Point cannot be below zero.','danger');return}if(gp>state.academic.gpaScale){document.getElementById('gradeErr').innerHTML=alertBox(`Grade Point cannot exceed the configured ${state.academic.gpaScale.toFixed(1)} scale.`,'danger');return}let g=state.grades.find(x=>x.courseId===cid);if(g)g.gradePoint=gp;else state.grades.push({id:'g'+Date.now(),courseId:cid,gradePoint:gp});course(cid).gradePoint=gp;ui.gradeCourse=cid;showToast('Grade updated');go('GPA-01')}
function renderGpa03(){return `${pageHead('GPA History','Track semester GPA over time.','GPA / CGPA / History')}<div class="grid"><div class="card span-8"><h3>GPA Trend</h3><div class="chart line-chart"><svg viewBox="0 0 600 160" role="img" aria-label="GPA trend rising across four semesters"><polyline points="20,120 205,90 390,70 575,45" fill="none" stroke="#5B5BD6" stroke-width="4"/><line x1="20" y1="140" x2="580" y2="140" stroke="#d9dde3"/><circle cx="20" cy="120" r="5" fill="#5B5BD6"/><circle cx="205" cy="90" r="5" fill="#5B5BD6"/><circle cx="390" cy="70" r="5" fill="#5B5BD6"/><circle cx="575" cy="45" r="5" fill="#5B5BD6"/></svg></div></div><div class="card span-4"><h3>Current Semester</h3><div class="stat"><div class="v">${semesterGpa().toFixed(2)}</div><div class="delta">Target ${state.academic.targetGpa.toFixed(2)}</div></div></div><div class="card span-12"><div class="table-wrap"><table><thead><tr><th>Semester</th><th>Credits</th><th>GPA</th></tr></thead><tbody>${state.gpaHistory.map(r=>`<tr><td>${esc(r.semester)}</td><td>${r.credits}</td><td>${r.gpa.toFixed(2)}</td></tr>`).join('')}</tbody></table></div></div></div><div class="actions"><button onclick="go('GPA-01')">Back to GPA / CGPA</button></div>`}

// ---------------- Planner ----------------
function plannerEvents(){return [...state.assignments.map(a=>({id:a.id,type:'Assignment',title:a.title,date:a.dueAt.slice(0,10),time:fmtTime(a.dueAt),completed:a.completed,overdue:assignmentStatus(a)==='Overdue',target:'ASSIGN-03'})),...state.exams.map(e=>({id:e.id,type:'Exam',title:e.title,date:e.date,time:e.time,completed:false,overdue:false,target:'EXAM-03'}))].sort((a,b)=>new Date(a.date)-new Date(b.date))}
function setPlannerView(v){ui.plannerView=v;render()}
function plannerNavigate(delta){ui.plannerOffset+=delta;render()}
function plannerListHtml(events){return `<div class="agenda">${events.map(ev=>`<div class="agenda-item"><div><b>${fmtDate(ev.date,{month:'short',day:'numeric'})}</b><div class="helper">${esc(ev.time)}</div></div><div><b>${esc(ev.title)}</b><div class="helper">${esc(ev.type)} · ${ev.type==='Assignment'?esc(course(assignment(ev.id).courseId).code):esc(course(exam(ev.id).courseId).code)}</div></div><button class="small" onclick="openPlannerEvent('${ev.type}','${ev.id}')">View</button></div>`).join('')||'<p class="muted">No planner items.</p>'}</div>`}
function plannerMonthHtml(events){const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+ui.plannerOffset);const year=base.getFullYear(),month=base.getMonth(),firstDay=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate();let cells=[];for(let i=0;i<firstDay;i++)cells.push(`<div class="cal-day"></div>`);for(let d=1;d<=days;d++){const date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,dayEvents=events.filter(e=>e.date===date);cells.push(`<div class="cal-day"><div class="cal-date">${d}</div>${dayEvents.map(ev=>`<div class="cal-event ${ev.completed?'completed':''} ${ev.overdue?'overdue':''}" onclick="openPlannerEvent('${ev.type}','${ev.id}')">${esc(ev.title)}</div>`).join('')}</div>`)}return `<div class="calendar"><div class="cal-head">Mon</div><div class="cal-head">Tue</div><div class="cal-head">Wed</div><div class="cal-head">Thu</div><div class="cal-head">Fri</div><div class="cal-head">Sat</div><div class="cal-head">Sun</div>${cells.join('')}</div><div class="planner-mobile-agenda" style="display:none">${plannerListHtml(events)}</div>`}
function plannerWeekHtml(events){return `<div class="grid">${[0,1,2,3,4,5,6].map(i=>{const d=new Date();d.setDate(d.getDate()+i);const key=d.toISOString().slice(0,10),es=events.filter(e=>e.date===key);return `<div class="card span-4"><h3>${fmtDate(key,{weekday:'short',month:'short',day:'numeric'})}</h3>${es.map(e=>`<div class="topic"><b>${esc(e.title)}</b><div class="helper">${esc(e.time)} · ${esc(e.type)}</div><button class="small" onclick="openPlannerEvent('${e.type}','${e.id}')">View</button></div>`).join('')||'<p class="muted">No events</p>'}</div>`}).join('')}</div>`}
function renderPlan01(){
let events=plannerEvents();const filtered=ui.plannerFilter&&ui.plannerFilter!=='All'?events.filter(e=>ui.plannerFilter==='Completed'?e.completed:e.type===ui.plannerFilter.slice(0,-1)):events;const base=new Date();base.setMonth(base.getMonth()+ui.plannerOffset);const label=ui.plannerView==='Month'?new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(base):ui.plannerView==='Week'?'This Week':'Upcoming';const content=ui.plannerView==='Month'?plannerMonthHtml(filtered):ui.plannerView==='Week'?plannerWeekHtml(filtered):plannerListHtml(filtered);return `<div class="pack-header"><div class="row start"><span class="ic-box indigo">${icon('cal','ic-lg')}</span><div><h2>Planner</h2><p class="muted">Assignments and exams in one academic schedule.</p></div></div><div class="row" style="margin-top:16px;justify-content:flex-start"><button onclick="plannerNavigate(-1)">${icon('arrowL','ic-sm')}&nbsp;Previous</button><button onclick="ui.plannerOffset=0;render()">Today</button><button onclick="plannerNavigate(1)">Next&nbsp;${icon('arrowR','ic-sm')}</button><b style="color:var(--ink)">${esc(label)}</b></div></div><div class="toolbar"><div></div><div class="toolbar-group">${segmented(['Month','Week','List'],ui.plannerView,'setPlannerView')}<button class="primary" onclick="showPlannerAdd()">${icon('plus','ic-sm')}&nbsp;Add</button></div></div><div class="toolbar"><div class="toolbar-group">${segmented(['All','Assignments','Exams','Completed'],ui.plannerFilter||'All','setPlannerFilter')}</div></div>${content}`
}

function showPlannerAdd(){openModal(`<h2>Add to Planner</h2><p class="muted">Planner items are created through their full forms.</p><div class="menu"><button onclick="closeModal();go('ASSIGN-02')">Add Assignment</button><button onclick="closeModal();go('EXAM-02')">Add Exam</button></div>`)}
function openPlannerEvent(type,id){if(type==='Assignment'){ui.assignmentId=id;const a=assignment(id);openDrawer(`<div class="modal-head"><div><h2>${esc(a.title)}</h2><p class="muted">${esc(course(a.courseId).name)}</p></div><button class="icon ghost" onclick="closeDrawer()" aria-label="Close">×</button></div><p>${esc(a.description)}</p><div class="meta-list"><div class="meta-item"><div class="label">Due</div><div class="value">${fmtDate(a.dueAt)} · ${fmtTime(a.dueAt)}</div></div><div class="meta-item"><div class="label">Status</div><div class="value">${statusBadge(assignmentStatus(a))}</div></div></div><div class="actions"><button class="primary" onclick="closeDrawer();go('ASSIGN-03')">Open Assignment</button><button onclick="toggleAssignment('${a.id}');closeDrawer()">${a.completed?'Mark Incomplete':'Mark Complete'}</button></div>`)}else{ui.examId=id;const e=exam(id);openDrawer(`<div class="modal-head"><div><h2>${esc(e.title)}</h2><p class="muted">${esc(course(e.courseId).name)}</p></div><button class="icon ghost" onclick="closeDrawer()" aria-label="Close">×</button></div><div class="meta-list"><div class="meta-item"><div class="label">Date</div><div class="value">${fmtDate(e.date)} · ${esc(e.time)}</div></div><div class="meta-item"><div class="label">Location</div><div class="value">${esc(e.location||'Not set')}</div></div></div><div class="actions"><button class="primary" onclick="closeDrawer();go('EXAM-03')">Open Exam</button><button onclick="closeDrawer();go('PREP-01')">Prepare Me for Exam</button></div>`)}}

function assignmentRows(items){return items.map(a=>`<div class="topic"><div class="row start"><div><b>${esc(a.title)}</b><div class="helper">${esc(course(a.courseId).code)} · ${fmtDate(a.dueAt)} ${fmtTime(a.dueAt)}</div></div><div>${priorityBadge(a.priority)} ${statusBadge(assignmentStatus(a))}</div></div><div class="actions flush" style="margin-top:8px"><button class="small" onclick="ui.assignmentId='${a.id}';go('ASSIGN-03')">View</button><button class="small" onclick="toggleAssignment('${a.id}')">${a.completed?'Mark Incomplete':'Mark Complete'}</button><button class="small" onclick="ui.assignmentId='${a.id}';go('ASSIGN-04')">Edit</button><button class="small danger" onclick="ui.assignmentId='${a.id}';go('ASSIGN-05')">Delete</button></div></div>`).join('')||'<p class="muted">No assignments match this view.</p>'}
function renderAssign01(){let items=state.assignments.slice();if(ui.assignmentFilter==='Upcoming')items=items.filter(a=>assignmentStatus(a)==='Upcoming');if(ui.assignmentFilter==='Overdue')items=items.filter(a=>assignmentStatus(a)==='Overdue');if(ui.assignmentFilter==='Completed')items=items.filter(a=>a.completed);return `${pageHead('Assignments','Track coursework deadlines and completion.','Planner / Assignments')}<div class="toolbar"><div class="toolbar-group">${segmented(['All','Upcoming','Overdue','Completed'],ui.assignmentFilter,'setAssignmentFilter')}<div class="field"><label for="assignCourseFilter">Course</label><select id="assignCourseFilter" onchange="ui.assignCourseFilter=this.value;render()"><option value="">All Courses</option>${state.courses.map(c=>`<option value="${c.id}" ${ui.assignCourseFilter===c.id?'selected':''}>${esc(c.code)}</option>`).join('')}</select></div><div class="field"><label for="assignSort">Sort</label><select id="assignSort" onchange="ui.assignmentSort=this.value;render()"><option>Due Date</option><option>Priority</option><option>Course</option></select></div></div><button class="primary" onclick="go('ASSIGN-02')">Add Assignment</button></div><div class="card">${assignmentRows(items.filter(a=>!ui.assignCourseFilter||a.courseId===ui.assignCourseFilter))}</div>`}

function renderAssign03(){const a=assignment(ui.assignmentId);return `${pageHead(a.title,`${course(a.courseId).code} · ${course(a.courseId).name}`,'Assignments / Detail')}<div class="grid"><div class="card span-8"><h2>Assignment Details</h2><p>${esc(a.description||'No description.')}</p><div class="meta-list"><div class="meta-item"><div class="label">Due Date</div><div class="value">${fmtDate(a.dueAt)} · ${fmtTime(a.dueAt)}</div></div><div class="meta-item"><div class="label">Priority</div><div class="value">${priorityBadge(a.priority)}</div></div><div class="meta-item"><div class="label">Status</div><div class="value">${statusBadge(assignmentStatus(a))}</div></div><div class="meta-item"><div class="label">Reminder</div><div class="value">${a.reminder?'Enabled':'Disabled'}</div></div></div></div><div class="card span-4"><h3>Actions</h3><div class="actions mobile-stack"><button class="primary" onclick="toggleAssignment('${a.id}')">${a.completed?'Mark Incomplete':'Mark Complete'}</button><button onclick="go('ASSIGN-04')">Edit</button><button class="danger" onclick="go('ASSIGN-05')">Delete</button></div></div></div>`}

function renderQuiz01(){const i=state.quiz.index,q=quizQuestions[i],selected=state.quiz.answers[i];return `${pageHead('Quiz',`Question ${i+1} of ${quizQuestions.length}`,'AI Study / Quiz')}<div class="progress"><span style="width:${quizProgress()}%"></span></div><div style="height:16px"></div><div class="card" style="max-width:860px;margin:auto"><h2>${esc(q.q)}</h2><div role="radiogroup" aria-label="Answer choices">${q.options.map((o,idx)=>`<button role="radio" aria-checked="${selected===idx}" class="answer-choice ${selected===idx?'selected':''}" onclick="selectQuizAnswer(${idx})"><b>${String.fromCharCode(65+idx)}.</b> ${esc(o)}</button>`).join('')}</div><div class="quiz-sticky"><button ${i===0?'disabled':''} onclick="quizPrev()">Previous</button><div>${i<quizQuestions.length-1?`<button class="primary" onclick="quizNext()">Next</button>`:`<button class="primary" onclick="go('QUIZ-02')">Submit Quiz</button>`}</div></div><div class="actions"><button class="ghost" onclick="confirmAction('Exit Quiz','Your selected answers remain in this prototype session.',()=>go('MCQ-02'),'Exit Quiz',false)">Exit Quiz</button></div></div>`}

function quizPrev(){state.quiz.index=Math.max(0,state.quiz.index-1);render()}
function quizNext(){state.quiz.index=Math.min(quizQuestions.length-1,state.quiz.index+1);render()}
function unansweredQuiz(){return quizQuestions.length-Object.keys(state.quiz.answers).length}
function renderQuiz02(){const n=unansweredQuiz();return `${pageHead('Submit Quiz','Review unanswered questions before submitting.','AI Study / Quiz')}<div class="card" style="max-width:620px">${n?alertBox(`<strong>${n} unanswered question${n===1?'':'s'}.</strong><br>You can return to answer them or submit anyway.`,'warning'):alertBox('All questions have an answer. You are ready to submit.','success')}<div class="actions end"><button onclick="go('QUIZ-01')">Continue Quiz</button><button class="primary" onclick="submitQuiz()">${n?'Submit Anyway':'Submit Quiz'}</button></div></div>`}
function submitQuiz(){state.quiz.submitted=true;const score=quizQuestions.reduce((a,q,i)=>a+(state.quiz.answers[i]===q.correct?1:0),0);state.quiz.correct=score;state.quiz.incorrect=quizQuestions.length-score;go('QUIZ-03')}
function renderQuiz03(){const correct=state.quiz.correct??quizQuestions.reduce((a,q,i)=>a+(state.quiz.answers[i]===q.correct?1:0),0),pct=Math.round(correct/quizQuestions.length*100);return `${pageHead('Quiz Results','Your score is calculated deterministically from answer correctness.','AI Study / Quiz')}<div class="grid"><div class="card span-4 stat"><div class="k">Score</div><div class="v">${correct}/${quizQuestions.length}</div></div><div class="card span-4 stat"><div class="k">Correct</div><div class="v">${correct}</div></div><div class="card span-4 stat"><div class="k">Incorrect</div><div class="v">${quizQuestions.length-correct}</div></div><div class="card span-12"><div class="row"><h3>Percentage</h3><b>${pct}%</b></div><div class="progress lg"><span style="width:${pct}%"></span></div><div class="actions"><button class="primary" onclick="state.quiz.reviewIndex=0;go('QUIZ-04')">Review Answers</button><button onclick="resetQuiz();go('QUIZ-01')">Retry Quiz</button><button onclick="go('AI-01')">Back to AI Study</button></div></div></div>`}
function renderQuiz04(){const i=state.quiz.reviewIndex,q=quizQuestions[i],ans=state.quiz.answers[i],ok=ans===q.correct;return `${pageHead('Review Answers',`Question ${i+1} of ${quizQuestions.length}`,'AI Study / Quiz Results')}<div class="card" style="max-width:860px;margin:auto"><h2>${esc(q.q)}</h2><div class="alert ${ok?'success':'danger'}"><b>${ok?'Correct':'Needs Review'}</b></div><div class="meta-list" style="grid-template-columns:1fr"><div class="meta-item"><div class="label">Your Answer</div><div class="value">${ans===undefined?'Unanswered':esc(q.options[ans])}</div></div><div class="meta-item"><div class="label">Correct Answer</div><div class="value">${esc(q.options[q.correct])}</div></div><div class="meta-item"><div class="label">Explanation</div><div class="value">${esc(q.explanation)}</div></div></div><div class="quiz-sticky"><button ${i===0?'disabled':''} onclick="state.quiz.reviewIndex--;render()">Previous</button><button ${i===quizQuestions.length-1?'disabled':''} onclick="state.quiz.reviewIndex++;render()">Next</button></div><div class="actions"><button onclick="go('QUIZ-03')">Back to Results</button></div></div>`}

function renderFlash02(){return `${pageHead('Flashcard Deck','Review deck details before studying.','AI Study / Flashcards')}<div class="grid"><div class="card span-8"><h2>Algorithms Core Concepts</h2><div class="meta-list"><div class="meta-item"><div class="label">Card Count</div><div class="value">${ui.flashCount}</div></div><div class="meta-item"><div class="label">Document</div><div class="value">${esc(doc(ui.documentId)?.name||'Study Document')}</div></div></div></div><div class="card span-4"><div class="actions mobile-stack"><button class="primary" onclick="resetFlash();go('FLASH-03')">Start Studying</button><button onclick="go('FLASH-01')">Regenerate</button><button class="danger" onclick="confirmDeleteDeck()">Delete Deck</button></div></div></div>`}
function resetFlash(){state.flash={index:0,flipped:false,known:0,review:0,order:[0,1,2,3,4]}}
function currentFlash(){return flashcards[state.flash.order[state.flash.index]%flashcards.length]}
function completeFlashSession(){go('FLASH-04')}
function renderFlash03(){const f=currentFlash(),flipped=state.flash.flipped;return `${pageHead('Study Flashcards',`Card ${state.flash.index+1} of ${state.flash.order.length}`,'AI Study / Flashcards')}<div class="progress"><span style="width:${Math.round((state.flash.index+1)/state.flash.order.length*100)}%"></span></div><div style="height:16px"></div><div class="flashcard" tabindex="0" role="button" aria-label="${flipped?'Answer side. Activate to show question.':'Question side. Activate to show answer.'}" onclick="flipFlash()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipFlash()}"><div class="face"><div class="label">${flipped?'Answer':'Question / Concept'}</div><div class="text">${esc(flipped?f.back:f.front)}</div><p class="helper">Click or press Enter to ${flipped?'show question':'flip card'}</p></div></div><div class="actions" style="justify-content:center"><button onclick="flashPrevious()" ${state.flash.index===0?'disabled':''}>Previous</button><button onclick="flashNext()" ${state.flash.index===state.flash.order.length-1?'disabled':''}>Next</button><button onclick="flipFlash()">Flip Card</button><button onclick="shuffleFlash()">Shuffle</button><button onclick="go('FLASH-02')">Exit</button><button onclick="completeFlashSession()">Complete Session</button></div>${flipped?`<div class="actions" style="justify-content:center"><button class="danger" onclick="rateFlash(false)">Again</button><button class="primary" onclick="rateFlash(true)">Know It</button></div>`:''}`}
function flipFlash(){state.flash.flipped=!state.flash.flipped;render()}
function flashPrevious(){state.flash.index=Math.max(0,state.flash.index-1);state.flash.flipped=false;render()}
function flashNext(){state.flash.index=Math.min(state.flash.order.length-1,state.flash.index+1);state.flash.flipped=false;render()}
function rateFlash(known){if(known)state.flash.known++;else state.flash.review++;if(state.flash.index>=state.flash.order.length-1){go('FLASH-04')}else{state.flash.index++;state.flash.flipped=false;render()}}
function shuffleFlash(){state.flash.order.sort(()=>Math.random()-.5);state.flash.index=0;state.flash.flipped=false;showToast('Deck shuffled');render()}
function renderFlash04(){return `${pageHead('Flashcard Session Complete','Your learning choices were applied during this study session.','AI Study / Flashcards')}<div class="kpi-row">${stat('Cards Reviewed',state.flash.known+state.flash.review)}${stat('Known',state.flash.known)}${stat('Need Review',state.flash.review)}</div><div class="actions"><button class="primary" onclick="resetFlash();go('FLASH-03')">Study Again</button><button onclick="go('FLASH-02')">Back to Deck</button></div>`}
function confirmDeleteDeck(){confirmAction('Delete Flashcard Deck','Delete this generated deck? The source document remains available.',()=>{showToast('Flashcard deck deleted');go('AI-01')},'Delete Deck')}

function examPackMcqs(){return `<div class="grid"><div class="card span-8"><h2>MCQ Practice</h2><p class="muted">32 generated questions cover high-priority exam topics. Use the quiz flow to practice with deterministic scoring.</p><div class="kpi-row" style="grid-template-columns:repeat(2,1fr)">${stat('Questions','32')}${stat('Difficulty','Mixed')}</div></div><div class="card span-4"><h3>Ready to practice?</h3><button class="primary" onclick="resetQuiz();go('QUIZ-01')">Practice MCQs</button></div></div>`}
function examPackFlashcards(){return `<div class="grid"><div class="card span-8"><h2>Flashcards</h2><p class="muted">30 generated concept cards for rapid active recall.</p><div class="kpi-row" style="grid-template-columns:repeat(2,1fr)">${stat('Cards','30')}${stat('Priority Deck','Algorithms Core')}</div></div><div class="card span-4"><h3>Study now</h3><button class="primary" onclick="resetFlash();go('FLASH-03')">Study Flashcards</button></div></div>`}
function examPackViva(){return `<div class="card"><h2>Viva Questions</h2>${prepViva.map(v=>`<div class="question-card"><b>${esc(v.q)}</b><div class="actions"><button class="small" onclick="toggleReveal('${v.id}')">${state.prep.revealed[v.id]?'Hide Answer':'Show Answer'}</button></div>${state.prep.revealed[v.id]?`<div class="answer-panel"><b>Suggested Answer</b><p>${esc(v.a)}</p></div>`:''}</div>`).join('')}</div>`}
function examPackStudyPlan(){const completed=Object.values(state.prep.tasks).filter(Boolean).length;return `<div class="card"><div class="section-title"><div><h2>Study Plan</h2><p class="muted">Day-by-day revision plan based on the selected preparation depth and available study time.</p></div>${badge(`${completed}/${prepTasks.length} complete`,completed===prepTasks.length?'success':'info')}</div>${prepTasks.map(t=>`<div class="topic"><div class="row start"><div><b>${esc(t.day)} · ${esc(t.topic)}</b><div class="helper">${esc(t.activity)} · ${esc(t.duration)}</div></div>${state.prep.tasks[t.id]?badge('Completed','success'):badge('Planned','info')}</div><div class="actions"><button class="small ${state.prep.tasks[t.id]?'':'primary'}" onclick="toggleStudyTask('${t.id}')">${state.prep.tasks[t.id]?'Mark Incomplete':'Mark Complete'}</button></div></div>`).join('')}</div>`}
function renderPrep06(){
const e=exam(state.prep.selectedExam),p=examPackProgress(),tabsList=['Overview','Important Topics','Short Questions','Long Questions','MCQs','Flashcards','Viva','Study Plan'];let body='';switch(state.prep.tab){case'Overview':body=examPackOverview();break;case'Important Topics':body=examPackTopics();break;case'Short Questions':body=qnaList(prepShort,'Short Questions');break;case'Long Questions':body=qnaList(prepLong,'Long Questions');break;case'MCQs':body=examPackMcqs();break;case'Flashcards':body=examPackFlashcards();break;case'Viva':body=examPackViva();break;case'Study Plan':body=examPackStudyPlan();break;default:body=examPackOverview()}return `<div class="pack-header"><div class="readiness-card"><div><span class="ai-chip">${icon('doc','ic-sm')}&nbsp;${esc(e.title)}</span><h2 style="margin-top:12px">Exam Pack</h2><p class="muted">${esc(course(e.courseId).name)} &middot; ${fmtDate(e.date)} &middot; ${Math.max(0,daysUntil(e.date))} day(s) remaining</p></div><div class="readiness-ring" style="background:conic-gradient(var(--indigo) 0 ${p}%,#E9EBF5 ${p}% 100%)" data-pct="${p}%"></div></div></div><div class="kpi-row">${stat('Important Topics','18')}${stat('Questions','32')}${stat('Flashcards','30')}${stat('Revision Progress',p+'%','Recommended study time: 6h')}</div>${tabs(tabsList,state.prep.tab,'setExamPackTab','exam-pack-tabs')}${body}<div class="actions"><button onclick="regenerateExamPack()">Regenerate Exam Pack</button></div>`
}
function regenerateExamPack(){state.prep.regenerate=true;go('PREP-04')}
// ---------------- Analytics ----------------
function setAnalyticsRange(v){ui.analyticsRange=v;render()}
function renderAna01(){return `${pageHead('Analytics','Understand study time, completion, attendance and GPA trends.','Analytics')}<div class="toolbar"><div>${segmented(['This Week','This Month','Semester','Custom'],ui.analyticsRange,'setAnalyticsRange')}</div><div class="toolbar-group"><div class="field"><label for="anaCourseFilter">Course</label><select id="anaCourseFilter"><option>All Courses</option>${state.courses.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><button onclick="go('ANA-02')">View Study Detail</button></div></div><div class="kpi-row">${stat('Study Hours','7.5')}${stat('Assignments Completed',state.assignments.filter(a=>a.completed).length)}${stat('Attendance Average',Math.round(state.courses.reduce((s,c)=>s+attendanceSummary(c.id).pct,0)/state.courses.length)+'%')}${stat('Current GPA',semesterGpa().toFixed(2))}</div><div style="height:16px"></div><div class="grid"><div class="card span-6"><h3>Study Time by Day</h3><div class="chart"><div class="bar-chart">${[['Mon',45],['Tue',80],['Wed',55],['Thu',95],['Fri',70],['Sat',120],['Sun',60]].map(([l,h])=>`<div class="bar" style="height:${Math.max(15,h)}px"><span>${l}</span></div>`).join('')}</div></div></div><div class="card span-6"><h3>Study Time by Course</h3><div class="chart"><div class="bar-chart">${[['ALG',110],['DB',80],['NET',65],['OS',90],['SE',55]].map(([l,h])=>`<div class="bar" style="height:${h}px"><span>${l}</span></div>`).join('')}</div></div></div><div class="card span-4"><h3>Assignment Completion</h3><div class="donut"></div><p class="muted" style="text-align:center">Completed vs active assignments</p></div><div class="card span-4"><h3>Attendance by Course</h3>${state.courses.slice(0,4).map(c=>{const s=attendanceSummary(c.id);return `<div class="topic"><div class="row"><span>${esc(c.code)}</span><b>${s.pct}%</b></div><div class="progress"><span style="width:${s.pct}%"></span></div></div>`}).join('')}</div><div class="card span-4"><h3>GPA Trend</h3><div class="chart line-chart"><svg viewBox="0 0 600 160" role="img" aria-label="GPA trend"><polyline points="20,120 205,95 390,72 575,48" fill="none" stroke="#5B5BD6" stroke-width="4"/><line x1="20" y1="140" x2="580" y2="140" stroke="#d9dde3"/></svg></div></div></div>`}
function renderAna02(){const sessions=state.focusHistory,total=sessions.reduce((a,s)=>a+s.duration,0),avg=sessions.length?Math.round(total/sessions.length):0;return `${pageHead('Study Detail','Session-level study analytics.','Analytics / Study Detail')}<div class="toolbar"><div class="field"><label for="anaDetailCourse">Course</label><select id="anaDetailCourse"><option>All Courses</option>${state.courses.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><button onclick="go('ANA-01')">Back to Analytics</button></div><div class="kpi-row">${stat('Sessions',sessions.length)}${stat('Total Time',total+' min')}${stat('Average Session',avg+' min')}</div><div style="height:16px"></div><div class="grid"><div class="card span-5"><h3>Study Trend</h3><div class="chart"><div class="bar-chart">${sessions.concat(sessions).slice(0,5).map((s,i)=>`<div class="bar" style="height:${Math.max(20,s.duration*2)}px"><span>S${i+1}</span></div>`).join('')}</div></div></div><div class="card span-7"><h3>Sessions</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Course</th><th>Duration</th><th>Goal</th></tr></thead><tbody>${sessions.map(s=>`<tr><td>${fmtDate(s.date)}</td><td>${esc(course(s.courseId).code)}</td><td>${s.duration} min</td><td>${esc(s.goal)}</td></tr>`).join('')}</tbody></table></div></div></div>`}

// ---------------- Notifications ----------------
function setNotificationTab(v){ui.notificationTab=v;render()}
function notificationIcon(type){return type.includes('Assignment')?'□':type.includes('Attendance')?'!':type.includes('Exam')?'◇':type.includes('Study')?'◷':'✦'}
function renderNotif01(){let items=state.notifications.filter(n=>ui.notificationTab==='All'||!n.read);if(!state.notifications.length)return renderNotif02();return `${pageHead('Notifications','Academic reminders and system updates.','Notifications')}<div class="toolbar"><div>${segmented(['All','Unread'],ui.notificationTab,'setNotificationTab')}</div><button onclick="markAllRead()" ${state.notifications.every(n=>n.read)?'disabled':''}>Mark All as Read</button></div><div class="card">${items.length?items.map(n=>`<div class="topic"><div class="row start"><div class="inline nowrap"><span class="badge info">${notificationIcon(n.type)}</span><div><b>${esc(n.title)}</b>${!n.read?' '+badge('Unread','warning'):''}<div class="helper">${esc(n.description)} · ${esc(n.timestamp)}</div></div></div><div class="actions flush"><button class="small" onclick="openNotification('${n.id}')">Open</button><button class="small" onclick="toggleNotificationRead('${n.id}')">${n.read?'Mark Unread':'Mark Read'}</button><button class="small danger" onclick="deleteNotification('${n.id}')">Delete</button></div></div></div>`).join(''):`<div class="empty" style="min-height:220px"><div><h2>No Unread Notifications</h2><p>Everything is read. Switch to All to see notification history.</p></div></div>`}</div>`}
function markAllRead(){state.notifications.forEach(n=>n.read=true);saveLocal();showToast('All notifications marked as read');render()}
function toggleNotificationRead(id){const n=state.notifications.find(x=>x.id===id);if(n)n.read=!n.read;saveLocal();render()}
function openNotification(id){const n=state.notifications.find(x=>x.id===id);if(!n)return;n.read=true;saveLocal();if(n.type==='Attendance Warning')ui.attendanceCourse='c2';if(n.type==='Assignment Due')ui.assignmentId='as1';if(n.type==='Exam Reminder')state.prep.selectedExam='e1';go(n.target)}
function deleteNotification(id){state.notifications=state.notifications.filter(n=>n.id!==id);saveLocal();showToast('Notification deleted');if(state.notifications.length===0)go('NOTIF-02');else render()}
function renderNotif02(){return `${pageHead('Notifications','You are all caught up.','Notifications')}${emptyState('No Notifications Yet','Assignment reminders, attendance warnings, exam reminders, study reminders and AI completion updates will appear here.','','')}`}

// ---------------- Settings ----------------
function renderSet01(){return settingsShell('SET-01',`<div class="card"><h2>Profile</h2><div class="grid"><div class="span-8">${textInput('setName','Full Name',state.user.name)}${textInput('setUni','University',state.user.university)}${textInput('setDegree','Degree',state.user.degree)}${selectInput('setCountry','Country',['Pakistan','Italy','United Kingdom','United States'],state.user.country)}${selectInput('setTimezone','Timezone',['Asia/Karachi','Europe/Rome','Europe/London','America/New_York'],state.user.timezone)}</div><div class="card span-4"><h3>Profile Photo</h3><div class="empty" style="min-height:170px"><div><div class="icon">○</div><p>${state.user.photo?'Photo selected':'No profile photo'}</p><button onclick="state.user.photo=true;render()">Change Photo</button> <button ${state.user.photo?'':'disabled'} onclick="state.user.photo=false;render()">Remove</button></div></div></div></div><div class="actions end"><button class="primary" onclick="saveProfileSettings()">Save Changes</button></div></div>`)}
function saveProfileSettings(){if(navigator.onLine===false){showSystemState('network');return}state.user.name=document.getElementById('setName').value.trim();state.user.university=document.getElementById('setUni').value.trim();state.user.degree=document.getElementById('setDegree').value.trim();state.user.country=document.getElementById('setCountry').value;state.user.timezone=document.getElementById('setTimezone').value;showToast('Settings saved');render()}
function renderSet02(){return settingsShell('SET-02',`<div class="card"><h2>Academic Preferences</h2>${textInput('setScale','GPA Scale Maximum',state.academic.gpaScale,{type:'number',min:1,max:10,step:'0.1'})}${textInput('setTargetGpa','Target GPA',state.academic.targetGpa,{type:'number',min:0,max:state.academic.gpaScale,step:'0.01'})}${textInput('setAtt','Default Attendance Target',state.academic.attendanceTarget,{type:'number',min:0,max:100})}${selectInput('setSemester','Active Semester',state.semesters.map(s=>({value:s.id,label:s.name})),state.academic.activeSemester)}<div id="setAcademicErr"></div><div class="actions between"><button onclick="go('SEM-01')">Manage Semesters</button><button class="primary" onclick="saveAcademicSettings()">Save Changes</button></div></div>`)}
function saveAcademicSettings(){if(navigator.onLine===false){showSystemState('network');return}const scale=+document.getElementById('setScale').value,target=+document.getElementById('setTargetGpa').value,att=+document.getElementById('setAtt').value;if(scale<=0||target<0||target>scale||att<0||att>100){document.getElementById('setAcademicErr').innerHTML=alertBox('Check GPA scale, target GPA and attendance target.','danger');return}state.academic.gpaScale=scale;state.academic.targetGpa=target;state.academic.attendanceTarget=att;setActiveSemester(document.getElementById('setSemester').value);showToast('Academic preferences saved')}
function renderSet03(){const p=state.prefs;return settingsShell('SET-03',`<div class="card"><h2>Notification Preferences</h2><label class="toggle-row"><input type="checkbox" ${p.assignment?'checked':''} onchange="state.prefs.assignment=this.checked"> Assignment Reminders</label><label class="toggle-row"><input type="checkbox" ${p.exam?'checked':''} onchange="state.prefs.exam=this.checked"> Exam Reminders</label><label class="toggle-row"><input type="checkbox" ${p.attendance?'checked':''} onchange="state.prefs.attendance=this.checked"> Attendance Warnings</label><label class="toggle-row"><input type="checkbox" ${p.study?'checked':''} onchange="state.prefs.study=this.checked"> Study Reminders</label><label class="toggle-row"><input type="checkbox" ${p.aiComplete?'checked':''} onchange="state.prefs.aiComplete=this.checked"> AI Completion Notifications</label><div class="divider"></div><div class="row"><div><h3>Browser Notification Status</h3><p class="muted">${esc(p.browser)}</p></div>${statusBadge(p.browser)}</div>${p.browser==='Blocked'?alertBox('Browser notifications are blocked. Enable permission in your browser settings, then retry.','warning'):''}<div class="actions"><button onclick="enableBrowserNotifications()">Enable Browser Notifications</button><button class="primary" onclick="saveLocal();showToast('Notification preferences saved')">Save Preferences</button></div></div>`)}
function renderSet04(){return settingsShell('SET-04',`<div class="grid"><div class="card span-4 stat"><div class="k">Credits Remaining</div><div class="v">${state.aiCredits}</div></div><div class="card span-4 stat"><div class="k">Credits Used</div><div class="v">${state.aiUsage.reduce((a,x)=>a+x.credits,0)}</div></div><div class="card span-4 stat"><div class="k">Reset Date</div><div class="v" style="font-size:18px">Oct 1</div></div><div class="card span-12"><h2>AI Usage</h2><p class="muted">Baseline V1 displays usage only; there is no payment flow.</p><div class="table-wrap"><table><thead><tr><th>Date</th><th>Feature</th><th>Document</th><th>Credits Used</th><th>Status</th></tr></thead><tbody>${state.aiUsage.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.feature)}</td><td>${esc(x.document)}</td><td>${x.credits}</td><td>${statusBadge(x.status)}</td></tr>`).join('')}</tbody></table></div></div></div>`)}
function renderSet05(){return settingsShell('SET-05',`<div class="card"><h2>Privacy & Data</h2><div class="topic"><h3>Personal Data</h3><p class="muted">Profile and account information used to personalize StudentOS.</p></div><div class="topic"><h3>Academic Data</h3><p class="muted">Semesters, courses, attendance, grades, assignments and exams.</p></div><div class="topic"><h3>Documents</h3><p class="muted">Uploaded study documents are represented as private storage in this prototype.</p><button class="danger" onclick="confirmDeleteUploadedDocuments()">Delete Uploaded Documents</button></div><div class="topic"><h3>AI Generated Content</h3><p class="muted">Summaries, MCQ sets, flashcard decks and Exam Packs derived from your documents.</p></div></div>`)}
function confirmDeleteUploadedDocuments(){confirmAction('Delete Uploaded Documents','Delete every uploaded study document? This action cannot be undone in the prototype.',()=>{state.documents=[];state.prep.selectedDocs=[];showToast('Uploaded documents deleted');render()},'Delete Documents')}
function renderSet06(){return settingsShell('SET-06',`<div class="card"><h2>Security</h2><div class="meta-list"><div class="meta-item"><div class="label">Email</div><div class="value">${esc(state.user.email)}</div></div><div class="meta-item"><div class="label">Password</div><div class="value">••••••••••</div></div></div><div class="actions"><button class="primary" onclick="openChangePasswordModal()">Change Password</button></div><div class="divider"></div><h3>Session Information</h3><div class="topic"><div class="row"><div><b>Current browser</b><div class="helper">Active now · Pakistan timezone</div></div>${badge('Current','success')}</div></div><p class="helper">Session details are shown only if supported by the eventual backend.</p></div>`)}
function openChangePasswordModal(){openModal(`<h2>Change Password</h2>${textInput('cpCurrent','Current Password','',{type:'password'})}${textInput('cpNew','New Password','',{type:'password',helper:'Use 8+ characters and a number.'})}${textInput('cpConfirm','Confirm New Password','',{type:'password'})}<div id="cpErr"></div><div class="actions end"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveChangedPassword()">Change Password</button></div>`)}
function saveChangedPassword(){const n=document.getElementById('cpNew').value,c=document.getElementById('cpConfirm').value;if(n.length<8||!(/\d/.test(n))){document.getElementById('cpErr').innerHTML=alertBox('Use at least 8 characters and one number.','danger');return}if(n!==c){document.getElementById('cpErr').innerHTML=alertBox('New passwords do not match.','danger');return}closeModal();showToast('Password changed')}
function renderSet07(){return settingsShell('SET-07',`<div class="card"><h2>Account</h2><div class="meta-list"><div class="meta-item"><div class="label">Email</div><div class="value">${esc(state.user.email)}</div></div></div><div class="actions"><button onclick="signOut()">Sign Out</button></div><div class="divider"></div><h3>Danger Zone</h3><p class="muted">Deleting your account permanently removes your StudentOS account and associated product data.</p><button class="danger" onclick="go('SET-08')">Delete Account</button></div>`)}
function renderSet08(){return settingsShell('SET-08',`<div class="card"><h2>Delete Account</h2>${alertBox('<strong>This permanently deletes your account and associated product data.</strong><br>This action cannot be undone.','danger')}${textInput('deleteWord','Type DELETE to confirm','',{placeholder:'DELETE'})}<label class="checkbox-row"><input type="checkbox" id="deleteAck" onchange="updateDeleteButton()"> I understand this cannot be undone.</label><div class="actions end"><button onclick="go('SET-07')">Cancel</button><button class="danger" id="deleteAccountButton" disabled onclick="performAccountDeletion()">Delete My Account</button></div></div>`)}
function updateDeleteButton(){const w=document.getElementById('deleteWord'),a=document.getElementById('deleteAck'),b=document.getElementById('deleteAccountButton');if(!w||!a||!b)return;const sync=()=>b.disabled=!(w.value==='DELETE'&&a.checked);w.oninput=sync;a.onchange=sync;sync()}
function performAccountDeletion(){const w=document.getElementById('deleteWord'),a=document.getElementById('deleteAck');if(!w||w.value!=='DELETE'||!a?.checked){showToast('Type DELETE and acknowledge the warning first.');return}confirmAction('Delete My Account','This is the final confirmation. StudentOS will return to Sign In.',()=>{state=clone(initialState);state.deleted=true;showToast('Account deleted');go('AUTH-01')},'Delete My Account')}
// ---------------- Interaction helpers, route map, audit ----------------
function confirmUnsaved(target){confirmAction('Discard Unsaved Changes','Changes on this form have not been saved. Leave this screen?',()=>go(target),'Discard Changes',true)}
function showSystemState(kind){const states={network:`<h2>Network Error</h2><p>StudentOS could not save your changes. Your form values are still available.</p><div class="actions"><button class="primary" onclick="closeModal();showToast('Retry succeeded')">Retry</button><button onclick="closeModal()">Back</button></div>`,ai:`<h2>AI Generation Failed</h2><p>The generation request failed without consuming the visible result state.</p><div class="actions"><button class="primary" onclick="closeModal();showToast('AI generation retried')">Retry</button><button onclick="closeModal()">Back</button></div>`};openModal(states[kind]||states.network)}
const renderers={
 'AUTH-01':renderAuth01,'AUTH-02':renderAuth02,'AUTH-03':renderAuth03,'AUTH-04':renderAuth04,'AUTH-05':renderAuth05,'AUTH-06':renderAuth06,
 'ONB-01':renderOnb01,'ONB-02':renderOnb02,'ONB-03':renderOnb03,'ONB-04':renderOnb04,'ONB-05':renderOnb05,'ONB-06':renderOnb06,'ONB-07':renderOnb07,
 'DASH-01':renderDash01,
 'SEM-01':renderSem01,'SEM-02':renderSem02,'SEM-03':renderSem03,'SEM-04':renderSem04,
 'COURSE-01':renderCourse01,'COURSE-02':renderCourse02,'COURSE-03':renderCourse03,'COURSE-04':renderCourse04,
 'ATT-01':renderAtt01,'ATT-02':renderAtt02,'ATT-03':renderAtt03,'ATT-04':renderAtt04,'ATT-05':renderAtt05,
 'GPA-01':renderGpa01,'GPA-02':renderGpa02,'GPA-03':renderGpa03,
 'PLAN-01':renderPlan01,
 'ASSIGN-01':renderAssign01,'ASSIGN-02':renderAssign02,'ASSIGN-03':renderAssign03,'ASSIGN-04':renderAssign04,'ASSIGN-05':renderAssign05,
 'EXAM-01':renderExam01,'EXAM-02':renderExam02,'EXAM-03':renderExam03,'EXAM-04':renderExam04,'EXAM-05':renderExam05,
 'FOCUS-01':renderFocus01,'FOCUS-02':renderFocus02,'FOCUS-03':renderFocus03,'FOCUS-04':renderFocus04,
 'AI-01':renderAi01,
 'DOC-01':renderDoc01,'DOC-02':renderDoc02,'DOC-03':renderDoc03,'DOC-04':renderDoc04,'DOC-05':renderDoc05,'DOC-06':renderDoc06,
 'SUM-01':renderSum01,'SUM-02':renderSum02,
 'MCQ-01':renderMcq01,'MCQ-02':renderMcq02,
 'QUIZ-01':renderQuiz01,'QUIZ-02':renderQuiz02,'QUIZ-03':renderQuiz03,'QUIZ-04':renderQuiz04,
 'FLASH-01':renderFlash01,'FLASH-02':renderFlash02,'FLASH-03':renderFlash03,'FLASH-04':renderFlash04,
 'PREP-01':renderPrep01,'PREP-02':renderPrep02,'PREP-03':renderPrep03,'PREP-04':renderPrep04,'PREP-05':renderPrep05,'PREP-06':renderPrep06,
 'ANA-01':renderAna01,'ANA-02':renderAna02,
 'NOTIF-01':renderNotif01,'NOTIF-02':renderNotif02,
 'SET-01':renderSet01,'SET-02':renderSet02,'SET-03':renderSet03,'SET-04':renderSet04,'SET-05':renderSet05,'SET-06':renderSet06,'SET-07':renderSet07,'SET-08':renderSet08
};
function prototypeAudit(){const rendererIds=Object.keys(renderers),missing=requiredIds.filter(id=>!renderers[id]),extra=rendererIds.filter(id=>!byId[id]);return{requiredScreens:requiredIds.length,purposeBuiltRenderers:rendererIds.length,missingRenderers:missing,genericRequiredScreens:0,extraRenderers:extra,authShellSeparated:requiredIds.filter(id=>id.startsWith('AUTH-')).every(id=>shellType(id)==='auth'),onboardingShellSeparated:requiredIds.filter(id=>id.startsWith('ONB-')).every(id=>shellType(id)==='onboarding'),mobileMore:['Attendance','GPA / CGPA','Focus','Analytics','Notifications','Settings','Help','Sign Out'],terminology:{planner:true,aiStudy:true,atRisk:true},academicLogic:{cancelledExcludedFromHeld:true,directNumericGpa:true,derivedOverdue:true,deterministicQuizScore:true}}}
window.StudentOSAudit=prototypeAudit;
window.addEventListener('popstate',e=>{current=(e.state&&e.state.id)||(location.hash.slice(1)||'DASH-01');render(current)});
document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
document.getElementById('drawerback').addEventListener('click',e=>{if(e.target.id==='drawerback')closeDrawer()});
document.addEventListener('keydown',e=>{trapOverlayFocus(e);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showSearch()}else if(e.key==='Escape'){closeModal();closeDrawer()}});
render(current);
